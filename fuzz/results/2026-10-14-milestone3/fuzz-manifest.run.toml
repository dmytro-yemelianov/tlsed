[package]
name = "tls-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
tls-core = { path = "../crates/tls-core" }
tls-crypto = { path = "../crates/tls-crypto" }
tls-crypto-awslc = { path = "../crates/tls-crypto-awslc" }

[[bin]]
name = "record_parser"
path = "fuzz_targets/record_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fragmented_records"
path = "fuzz_targets/fragmented_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auth_counter"
path = "fuzz_targets/auth_counter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_reassembly"
path = "fuzz_targets/handshake_reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protected_records"
path = "fuzz_targets/protected_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcript_labels"
path = "fuzz_targets/transcript_labels.rs"
test = false
doc = false
bench = false

# Deliberately independent of the stable root workspace/toolchain profile.
[workspace]
members = ["."]

[lints.rust]
unsafe_code = "forbid"
