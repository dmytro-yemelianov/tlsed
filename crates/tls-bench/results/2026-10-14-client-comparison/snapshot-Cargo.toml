[workspace]
members = ["crates/tls-core", "crates/tls-crypto", "crates/tls-crypto-awslc", "crates/tls-pki", "crates/tls-client", "crates/tls-bench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
