name = "tlsed_linked_arithmetic"
version = "0.1.0"
defaultTargets = ["Proof", "ReassemblyProof", "ProtectedProof", "KeyScheduleProof", "ClientProof"]

[leanOptions]
warningAsError = true

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "557eff83ecef5083b98a52a94ca7fae63d6c1dab"
subDir = "backends/lean"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fabf563a7c95a166b8d7b6efca11c8b4dc9d911f"

[[lean_lib]]
name = "TlsCore"
srcDir = "generated"

[[lean_lib]]
name = "Tls13"
srcDir = "../../lean"
roots = ["Tls13.Segmentation", "Tls13.Reassembly", "Tls13.Protected", "Tls13.KeySchedule", "Tls13.Record", "Tls13.Handshake", "Tls13.Client"]

[[lean_lib]]
name = "Proof"

[[lean_lib]]
name = "ReassemblyProof"

[[lean_lib]]
name = "ProtectedProof"

[[lean_lib]]
name = "KeyScheduleProof"

[[lean_lib]]
name = "ClientProof"
